<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECONTO IoT System - Piattaforma Web & PWA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --border-color: #374151;
      --border-subtle: rgba(255, 255, 255, 0.08);

      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #f43f5e;

      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;

      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;

      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-primary); color: var(--text-main); line-height: 1.5; min-height: 100vh; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 280px; background-color: var(--bg-secondary); border-right: 1px solid var(--border-subtle); padding: 24px; display: flex; flex-direction: column; }
    .main-content { flex: 1; padding: 32px; overflow-y: auto; }

    .brand-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: var(--shadow-glow); }
    .brand-title { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .nav-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm); color: var(--text-muted); text-decoration: none; font-weight: 500; transition: all 0.2s ease; cursor: pointer; border: 1px solid transparent; }
    .nav-item:hover, .nav-item.active { background-color: rgba(56, 189, 248, 0.1); color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.2); }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-cyan); }
    .stat-card.warning::before { background: var(--accent-amber); }
    .stat-card.danger::before { background: var(--accent-rose); }
    .stat-card.success::before { background: var(--accent-green); }

    .stat-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--text-main); margin: 8px 0; }
    .stat-desc { font-size: 0.8rem; color: var(--text-dim); }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-success { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-warning { background: rgba(251, 191, 36, 0.15); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-danger { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.3); }
    .badge-info { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); }

    .table-container { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: rgba(255, 255, 255, 0.02); padding: 14px 18px; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--border-subtle); }
    td { padding: 16px 18px; border-bottom: 1px solid var(--border-subtle); font-size: 0.9rem; }
    tr:hover { background-color: rgba(255, 255, 255, 0.02); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: all 0.2s ease; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-cyan), #0284c7); color: #fff; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4); }
    .btn-secondary { background-color: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.12); }
    .btn-success { background: linear-gradient(135deg, var(--accent-green), #059669); color: #fff; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // --- DATABASE EMULATO LOCALE ---
    const STORAGE_KEY = 'DECONTO_WEB_DB_V1';
    const initialData = {
      clients: [
        { id: 'cli_1', name: 'Bar Milano Central', refPerson: 'Mario Rossi', phone: '+39 02 5551234', address: 'Via Roma 12', city: 'Milano' },
        { id: 'cli_2', name: 'Ristorante La Perla', refPerson: 'Elena Neri', phone: '+39 06 7778899', address: 'Corso Italia 45', city: 'Roma' },
        { id: 'cli_3', name: 'Studio Legale Brambilla', refPerson: 'Avv. Brambilla', phone: '+39 02 4443322', address: 'Via Montenapoleone 8', city: 'Milano' }
      ],
      machines: [
        { id: 'mc_1', serialNumber: 'SN-MC-2026-9912', model: 'DeLonghi Pod Professional 1G', clientId: 'cli_1' },
        { id: 'mc_2', serialNumber: 'SN-MC-2026-8843', model: 'Faber Slot Plast Single', clientId: 'cli_2' },
        { id: 'mc_3', serialNumber: 'SN-MC-2026-7711', model: 'Didiesse Frog Revolution', clientId: 'cli_3' }
      ],
      decontoBoards: [
        { id: 'board_3467', shortCode: '3467', hwSerial: 'DC-HW-8841', machineId: 'mc_1', remainingCredits: 145, lowStockThreshold: 20, relayStatus: 'CLOSED_OK', isOnlineWifi: true, lastSyncDate: new Date().toISOString() },
        { id: 'board_1289', shortCode: '1289', hwSerial: 'DC-HW-7732', machineId: 'mc_2', remainingCredits: 320, lowStockThreshold: 20, relayStatus: 'CLOSED_OK', isOnlineWifi: false, lastSyncDate: new Date(Date.now() - 86400000 * 3).toISOString() },
        { id: 'board_5510', shortCode: '5510', hwSerial: 'DC-HW-9910', machineId: 'mc_3', remainingCredits: 12, lowStockThreshold: 20, relayStatus: 'CLOSED_OK', isOnlineWifi: false, lastSyncDate: new Date(Date.now() - 86400000 * 12).toISOString() }
      ],
      backups: [
        { id: 'bak_001', timestamp: new Date(Date.now() - 86400000).toISOString(), repo: 'deconto-org/deconto-db-backups', commitHash: 'a1b2c3d4e5', status: 'SUCCESS', recordCount: 28 }
      ]
    };

    function loadDb() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) return JSON.parse(s);
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initialData));
      return initialData;
    }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    let dbData = loadDb();

    // STATO APP
    let state = { currentRole: 'ADMIN', activeTab: 'dashboard' };

    function renderApp() {
      const app = document.getElementById('app');
      
      const roles = [
        { id: 'ADMIN', label: '👨‍💼 Admin' },
        { id: 'UFFICIO', label: '👩‍💻 Ufficio' },
        { id: 'ADR', label: '🚚 ADR' },
        { id: 'CLIENT_DIY', label: '📱 Cliente Fai-da-Te' }
      ];

      let navItems = [];
      if (state.currentRole === 'ADMIN') {
        navItems = [
          { id: 'dashboard', label: '📊 Dashboard BI', icon: '📈' },
          { id: 'maintenance', label: '🛠️ Manutenzione Predittiva', icon: '⚠️' },
          { id: 'backups', label: '💾 Backup GitHub', icon: '🐙' },
          { id: 'simulator', label: '☕ Simulatore Hardware', icon: '⚡' }
        ];
      } else if (state.currentRole === 'UFFICIO') {
        navItems = [
          { id: 'clients', label: '🏢 Anagrafica Clienti', icon: '🏢' },
          { id: 'qr_generator', label: '🏷️ Generatore Etichette QR', icon: '🖨️' },
          { id: 'otp_generator', label: '🔑 Genera Ricarica OTP', icon: '💬' },
          { id: 'simulator', label: '☕ Simulatore Hardware', icon: '⚡' }
        ];
      } else if (state.currentRole === 'ADR') {
        navItems = [
          { id: 'adr_visits', label: '🗺️ Giro Consegne', icon: '🚚' },
          { id: 'simulator', label: '☕ Simulatore Hardware', icon: '⚡' }
        ];
      } else {
        navItems = [
          { id: 'client_refill', label: '📱 Ricarica WhatsApp', icon: '✨' },
          { id: 'simulator', label: '☕ Simulatore Hardware', icon: '⚡' }
        ];
      }

      let contentHtml = '';
      if (state.activeTab === 'simulator') {
        const board = dbData.decontoBoards[0];
        contentHtml = `
          <div>
            <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 24px;">⚡ Banco Prova Hardware ESP32-C6</h1>
            
            <div style="grid-template-columns: 1fr 1fr; display: grid; gap: 24px;">
              <div class="stat-card" style="padding: 24px;">
                <h3>Macchina #${board.shortCode}</h3>
                <div style="font-size: 3.5rem; font-weight: 900; text-align: center; color: var(--accent-green);" id="sim-c-val">${board.remainingCredits}</div>
                <div style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Caffè Rimanenti</div>
                
                <button class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem;" onclick="simBrew('${board.shortCode}')">
                  ☕ EROGA 1 CAFFÈ (Impulso 230V)
                </button>
              </div>

              <div class="table-container">
                <div style="padding: 16px; font-weight: 700; border-bottom: 1px solid var(--border-subtle);">📟 Console Firmware ESP32-C6</div>
                <div id="sim-log-box" style="padding: 16px; font-family: monospace; font-size: 0.85rem; color: var(--accent-green); background: #000; height: 180px; overflow-y: auto;">
                  [SYSTEM]: ESP32-C6 Firmware v2.1.0 Pronto.<br>
                  [HW]: Relè di blocco impostato su CLOSED_OK.<br>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (state.currentRole === 'ADMIN' && state.activeTab === 'backups') {
        contentHtml = `
          <div>
            <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 16px;">🐙 Pipeline Backup Automatico GitHub</h1>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Snapshot del Database versionato quotidianamente su repository privato</p>

            <button class="btn btn-primary" style="margin-bottom: 24px;" onclick="triggerBackup()">⚡ Esegui Backup Adesso</button>

            <div class="table-container">
              <table>
                <thead>
                  <tr><th>ID</th><th>Data/Ora</th><th>Repo GitHub</th><th>Commit Hash</th><th>Stato</th></tr>
                </thead>
                <tbody>
                  ${dbData.backups.map(b => `<tr><td><code>${b.id}</code></td><td>${new Date(b.timestamp).toLocaleString('it-IT')}</td><td><code>${b.repo}</code></td><td><code>${b.commitHash}</code></td><td><span class="badge badge-success">✓ SUCCESS</span></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else {
        contentHtml = `
          <div>
            <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 16px;">📊 Piattaforma Controllo DECONTO</h1>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Ruolo attuale: <strong>${state.currentRole}</strong></p>

            <div class="card-grid">
              <div class="stat-card"><div class="stat-label">Clienti</div><div class="stat-value">${dbData.clients.length}</div></div>
              <div class="stat-card success"><div class="stat-label">Schede Attive</div><div class="stat-value" style="color: var(--accent-green);">${dbData.decontoBoards.length}</div></div>
              <div class="stat-card warning"><div class="stat-label">Sottoscorta (&lt;20)</div><div class="stat-value" style="color: var(--accent-amber);">1</div></div>
            </div>

            <div class="table-container">
              <table>
                <thead><tr><th>Codice</th><th>Cliente</th><th>Seriale Macchina</th><th>Credito</th><th>Relè</th></tr></thead>
                <tbody>
                  ${dbData.decontoBoards.map(b => {
                    const m = dbData.machines.find(x => x.id === b.machineId);
                    const c = m ? dbData.clients.find(x => x.id === m.clientId) : null;
                    return `<tr><td><span class="badge badge-info">${b.shortCode}</span></td><td><strong>${c ? c.name : 'N/D'}</strong></td><td><code>${m ? m.serialNumber : 'N/D'}</code></td><td><strong style="color: var(--accent-green);">${b.remainingCredits} caffè</strong></td><td><span class="badge badge-success">🔓 CHIUSO</span></td></tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="app-container">
          <aside class="sidebar">
            <div class="brand-logo">
              <div class="brand-icon">☕</div>
              <div><div class="brand-title">DECONTO</div><div style="font-size: 0.75rem; color: var(--accent-cyan);">IoT Vending</div></div>
            </div>
            
            <div style="margin-bottom: 24px;">
              <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">SELEZIONA RUOLO:</label>
              <select id="sel-role" style="width: 100%; padding: 8px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;" onchange="changeRole(this.value)">
                ${roles.map(r => `<option value="${r.id}" ${r.id === state.currentRole ? 'selected' : ''}>${r.label}</option>`).join('')}
              </select>
            </div>

            <div class="nav-group">
              ${navItems.map(i => `<div class="nav-item ${i.id === state.activeTab ? 'active' : ''}" onclick="changeTab('${i.id}')"><span>${i.icon}</span><span>${i.label}</span></div>`).join('')}
            </div>
          </aside>

          <main class="main-content">
            ${contentHtml}
          </main>
        </div>
      `;
    }

    function changeRole(r) {
      state.currentRole = r;
      state.activeTab = (r === 'ADMIN') ? 'dashboard' : ((r === 'UFFICIO') ? 'clients' : ((r === 'ADR') ? 'adr_visits' : 'client_refill'));
      renderApp();
    }
    function changeTab(t) { state.activeTab = t; renderApp(); }

    function triggerBackup() {
      dbData.backups.unshift({
        id: 'bak_' + Date.now(),
        timestamp: new Date().toISOString(),
        repo: 'deconto-org/deconto-db-backups',
        commitHash: Math.random().toString(36).substring(2, 10),
        status: 'SUCCESS',
        recordCount: 28
      });
      saveDb(dbData);
      alert('✅ Backup Eseguito con Successo su GitHub!');
      renderApp();
    }

    function simBrew(shortCode) {
      const b = dbData.decontoBoards.find(x => x.shortCode === shortCode);
      if (!b || b.remainingCredits <= 0) {
        alert('🔒 CREDITO ESAURITO! Relè in blocco.');
        return;
      }
      b.remainingCredits -= 1;
      saveDb(dbData);
      
      const logBox = document.getElementById('sim-log-box');
      if (logBox) {
        logBox.innerHTML += `[BREW]: Impulso 230V registrato. Credito rimanente: ${b.remainingCredits}.<br>`;
        logBox.scrollTop = logBox.scrollHeight;
      }
      document.getElementById('sim-c-val').innerText = b.remainingCredits;
    }

    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
